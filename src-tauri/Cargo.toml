[package]
name = "sistema-oficina"
version = "0.1.0"
edition = "2021"
description = "Sistema de gestão de oficina mecânica (Tauri + Rust)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
oficina-core = { path = "../crates/oficina-core" }
tauri = { version = "2", features = [] }
serde_json = "1"
rusqlite = "0.32"
hex = "0.4"
reqwest = { version = "0.13", default-features = true, features = ["blocking", "json", "form", "query"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }
axum = "0.8"
