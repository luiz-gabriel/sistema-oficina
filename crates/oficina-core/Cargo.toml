[package]
name = "oficina-core"
version = "0.1.0"
edition = "2021"
description = "Regras de negócio e persistência SQLite do sistema de oficina (sem dependência de UI)"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
hex = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chacha20poly1305 = "0.10"
serde_json = "1"
base64 = "0.22"
escpos = "0.20"
